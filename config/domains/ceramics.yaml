name: ceramics
description: ceramics science and engineering
collection_prefix: memento-ceramics
entity_registry: ceramics
corpus_dir: Ceramics
# model-free claim checks of Thorough check (memento/agentic_validation/scientific_checks.py): numbers in the cited text,
# units that fit the property, crystal phases as in the source
claim_rules: [numbers, units, phases]
neo4j_uri: bolt://localhost:7688

instruction: >-
  Retrieve ceramics science research content relevant to the query,
  including passages, figures, charts, and tables.

system_prompt: >-
  You are a scientific assistant for a ceramics science research document library.
  Answer using ONLY the numbered source excerpts below. Cite every factual
  claim with its excerpt number [N]; multiple sources get [2][5]. Do not
  invent or reuse citation numbers.
  Never write paper names, page numbers, or source metadata in your answer
  text — cite only [N]. The reader's interface already shows the paper and
  page for each [N]; repeating them risks misquoting. Exception: when the user
  asks where something comes from, name the document by its title as the
  sources give it, with its [N].
  Preserve epistemic status — if a source is preliminary or hypothetical,
  say so (e.g. "the authors hypothesise…").
  Keep numbers, units and conditions exactly as the source states them.
  When several documents address the question, use each relevant one and make
  clear when findings come from different studies ("one study [3] … another
  [7]"); when sources disagree, say so and cite both sides.
  If the sources found for this question do not answer it, say so plainly in
  your own words (for example "The papers I found don't mention GANs."), not
  with a stock phrase such as "The sources found do not cover", and never claim
  that the library or the documents lack it; say briefly what they do cover if
  it is related, and do not guess. Call the collection "the library", never
  "the corpus".
  Answer directly — never preface with "based on the sources" or refer to
  the excerpts at all.
  For figures, charts, or equations: describe them with citations; do not
  comment on display capabilities.
  Answer in the language the user writes in, unless they request otherwise.
  Cite source text in its original language.
  Match answer length and depth to the question. When the question asks for several items (documents, materials, methods, values…), answer with a bulleted list, one item per line with its citation; when it asks which documents or papers, name each by its title as given in the sources.

section_hints:
  Abstract:               [abstract, kurzfassung, zusammenfassung]
  Keywords:               [keywords, key words, index terms,
                           schlüsselwörter, schlagwörter, stichwörter, stichworte]
  Introduction:           [introduction, einleitung, einführung]
  Background:             [background, related work, literature review,
                           hintergrund, stand der technik, stand der forschung,
                           verwandte arbeiten]
  Methods:                [method, methodology, experimental,
                           materials and methods, methode, methodik, experimentell]
  Results:                [results, ergebnis]
  Results and Discussion: [results, ergebnis, discussion, diskussion]
  Discussion:             [discussion, diskussion]
  Conclusion:             [conclusion, concluding, fazit, schlussfolgerung,
                           summary, outlook, ausblick, future scope, future work,
                           future direction, future research,
                           zukünftige arbeit, zukünftige forschung, künftige forschung]
  Declarations:           [acknowledg, danksagung]
  Nomenclature:           [nomenclature, nomenklatur, formelzeichen]
  References:             [references, bibliography, literatur,
                           literaturverzeichnis, quellenverzeichnis, referenzen]
  Appendix:               [appendix, supplementary, supporting information,
                           anhang, zusatzmaterial]

section_roles:
  declared:    [Abstract, Keywords]
  substantive: [Results, Results and Discussion, Discussion, Conclusion, Conclusions]
  discounted:  [References, Declarations, Introduction]
  gap_fallback: [Discussion, Results and Discussion, Conclusion]

# Words that label figures, tables and equations in captions and in the authors' citations. Words where one is a prefix
# of the other form one family and match each other ("Fig. 5" finds "Figure 5", "Abb. 3" finds "Abbildung 3"); other
# words stay separate ("Scheme 1" never finds "Fig. 1"). Families: memento/ingestion/enrich_parsed_content_list.py.
structural_labels:
  figure:   [fig, figs, figure, figures, abb, abbildung, abbildungen, bild, scheme, chart, plate]
  table:    [table, tables, tab, tabelle, tabellen]
  equation: [eq, eqn, equation, gl, gleichung]

document_noun:
  singular: document
  plural: documents

parsing:
  title_banner_tokens:
    - abstract
    - access
    - article
    - articles
    - available
    - book
    - brief
    - check
    - chapter
    - commentary
    - communication
    - communications
    - contents
    - correction
    - editorial
    - erratum
    - for
    - full
    - in
    - introduction
    - journal
    - letter
    - letters
    - list
    - news
    - "of"
    - open
    - original
    - paper
    - papers
    - perspective
    - report
    - reports
    - research
    - review
    - reviews
    - science
    - sciencedirect
    - scientific
    - supplementary
    - the
    - type
    - updates
  title_search_headings: 4
  title_min_tokens: 3
  bib_entry_pattern: '^\s*\[?(\d{1,3})\]?\s*[.)]?\s+(.+)$'
  reference_section_pattern: '^\s*(references?(\s+list)?|bibliography|literature cited|works cited)\s*$'
  citation_marker_pattern: '\[(\d+(?:\s*[-–,]\s*\d+)*)\]'
